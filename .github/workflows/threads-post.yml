name: Threads Post

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "쓰레드 주제"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run threads-post via Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            CLAUDE.md의 쓰레드 문체 가이드에 맞춰 다음 주제로 150자 내외 쓰레드 문구를 3개 만들고,
            각각을 `node scripts/slack-text.mjs '<문구>'`로 Slack #sns 채널에 전송해줘: ${{ github.event.inputs.topic }}
          claude_args: |
            --allowedTools Bash,Read,Write,Edit,Glob,Grep
            --dangerously-skip-permissions
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
