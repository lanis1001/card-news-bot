name: Card News

on:
  workflow_dispatch:
    inputs:
      excerpt:
        description: "뉴스 발췌문 또는 소재"
        required: true
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate slide copy (Claude API)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-slides.mjs "${{ github.event.inputs.excerpt }}"

      - name: Render PNG images
        run: node scripts/capture.mjs output/slides.json

      - name: Upload to Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          FILES=$(node scripts/list-slide-files.mjs)
          CAPTION=$(cat output/caption.txt)
          node scripts/slack-upload.mjs "$FILES" "$CAPTION"
