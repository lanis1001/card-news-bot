<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Hahmlet:wght@400;500;600&display=swap');
  body { margin: 0; }
  .card {
    width: 1080px;
    height: 1350px;
    background: #f4efe4;
    border: 10px solid #1a1a1a;
    box-sizing: border-box;
    padding: 80px 70px;
    font-family: 'Hahmlet', serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    color: #1a1a1a;
    position: relative;
  }
  .eyebrow { font-size: 26px; font-weight: 500; letter-spacing: 5px; text-transform: uppercase; margin-bottom: 30px; color: #6b5f4a; word-break: keep-all; }
  .headline { font-size: 60px; font-weight: 600; line-height: 1.35; margin-bottom: 40px; letter-spacing: -1px; word-break: keep-all; }
  .body { font-size: 32px; font-weight: 400; line-height: 1.65; word-break: keep-all; }
  .footer {
    position: absolute;
    bottom: 60px;
    left: 70px;
    right: 70px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 2px;
    word-break: keep-all;
  }
  .footer-right { color: #6b5f4a; }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">{{EYEBROW}}</div>
    <div class="headline">{{HEADLINE}}</div>
    <div class="body">{{BODY}}</div>
    <div class="footer">
      <span class="footer-left">{{FOOTER}}</span>
      <span class="footer-right">{{FOOTER_RIGHT}}</span>
    </div>
  </div>
</body>
</html>
